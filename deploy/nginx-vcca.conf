# /etc/nginx/sites-available/vcca  (ln -s to sites-enabled; replace vcca.example.com)
# HTTPS: sudo certbot --nginx -d vcca.example.com   (certbot fills in the ssl_certificate lines)
server {
    listen 80;
    server_name vcca.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name vcca.example.com;

    # ssl_certificate     /etc/letsencrypt/live/vcca.example.com/fullchain.pem;   # managed by certbot
    # ssl_certificate_key /etc/letsencrypt/live/vcca.example.com/privkey.pem;     # managed by certbot

    client_max_body_size 600m;          # VAMSYS workspaces.db upload (app limit: VCCA_MAX_UPLOAD_MB, default 512)
    client_body_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;       # used for login rate limiting (VCCA_TRUST_PROXY=1)
        proxy_set_header X-Forwarded-Proto $scheme;          # https -> session cookie gets "Secure"
        proxy_read_timeout 300s;                             # report payload / zip of a run folder
        proxy_send_timeout 300s;
        proxy_request_buffering off;                         # stream uploads straight to the app
    }
}
